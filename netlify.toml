# AutoShine. Static site in /public, booking API in /netlify/functions.
# NOTE: the old config ran "node build.mjs" and published "dist". That build script was not
# in the files supplied, so this publishes the ready-made /public folder instead.

[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = false

[[redirects]]
  from = "/cart"
  to = "/"
  status = 301
  force = false

[[redirects]]
  from = "/cart/*"
  to = "/"
  status = 301
  force = false

